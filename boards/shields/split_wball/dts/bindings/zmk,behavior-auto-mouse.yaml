description: |
  A behavior that manages automatic layer switching for mouse functionality.
  Can be used to manually control auto mouse features or provide an API 
  for input processors.

compatible: "zmk,behavior-auto-mouse"

include: behavior.yaml

properties:
  layer:
    type: int
    required: true
    description: |
      The layer index to activate for mouse functionality.

  timeout-ms:
    type: int
    default: 600
    description: |
      Timeout in milliseconds before automatically returning to the original layer.
      Set to 0 to disable timeout (manual deactivation only).

  enable-on-init:
    type: boolean
    default: true
    description: |
      Whether the auto mouse functionality should be enabled on initialization.

  auto-enable:
    type: boolean
    default: true
    description: |
      Whether the auto mouse should be automatically triggered by input processors.

  "#binding-cells":
    const: 1